name: Deploy to Heroku

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  HEROKU_APP: cloud-operation-agent
  REGISTRY: registry.heroku.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Heroku Container Registry
        run: |
          echo ${{ secrets.HEROKU_API_KEY }} | docker login -u=_ --password-stdin registry.heroku.com

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.HEROKU_APP }}/web:${{ github.sha }} .
          docker tag ${{ env.REGISTRY }}/${{ env.HEROKU_APP }}/web:${{ github.sha }} \
                     ${{ env.REGISTRY }}/${{ env.HEROKU_APP }}/web:latest
          docker push ${{ env.REGISTRY }}/${{ env.HEROKU_APP }}/web:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.HEROKU_APP }}/web:latest

      - name: Release to Heroku
        run: |
          heroku container:release web -a ${{ env.HEROKU_APP }}
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}

      - name: Get Heroku app URL
        id: deployment
        run: |
          APP_URL=$(heroku apps:info ${{ env.HEROKU_APP }} -a ${{ env.HEROKU_APP }} --json | jq -r '.web_url')
          echo "Deployed to: $APP_URL"
          echo "SERVICE_URL=$APP_URL" >> $GITHUB_OUTPUT

      - name: Run smoke tests
        run: |
          APP_URL=${{ steps.deployment.outputs.SERVICE_URL }}
          # Wait for app to be ready
          sleep 30
          # Test endpoint
          curl -f $APP_URL/_stcore/health || exit 1

      - name: Notify deployment
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Cloud Operation Agent deployed to Heroku: ${{ steps.deployment.outputs.SERVICE_URL }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author
        continue-on-error: true
