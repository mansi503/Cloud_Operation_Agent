[project]
name = "cloud-operation-agent"
version = "0.1.0"
description = "Cloud Operation Agent - LLM-powered chatbot for cloud operations, monitoring, and cost analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Your Name", email = "your.email@dnv.com"}
]
license = {text = "MIT"}

dependencies = [
    # Core LLM & LangChain
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-groq>=0.1.0",
    "groq>=0.4.0",
    "langgraph>=0.0.50",
    "langchain-mcp-adapters>=0.0.1",
    
    # Removed: Azure OpenAI (using Groq instead)
    # "openai>=1.0.0",
    # "azure-identity>=1.13.0",
    
    # UI & Web
    "streamlit>=1.28.0",
    
    # HTTP & API
    "httpx>=0.24.0",
    "requests>=2.31.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    
    # Data handling
    "pandas>=2.0.0",
    "openpyxl>=3.0.0",  # For Excel file reading
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
